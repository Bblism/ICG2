<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Final with Light Controls + Animations + About Me + Credit</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- three.js core -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

  <script>
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(10, 3, 5);
    camera.lookAt(0, 1, 0);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Sun Light
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 50;
    sunLight.shadow.camera.left = -10;
    sunLight.shadow.camera.right = 10;
    sunLight.shadow.camera.top = 10;
    sunLight.shadow.camera.bottom = -10;
    sunLight.shadow.bias = -0.001;
    sunLight.shadow.normalBias = 0.005;
    scene.add(sunLight);

    // Point Light
    const pointLight = new THREE.PointLight(0x00ff00, 1, 5);
    pointLight.position.set(3, 3, 0);
    pointLight.castShadow = true;
    scene.add(pointLight);

    // Floor
    const planeGeometry = new THREE.PlaneGeometry(20, 20);
    const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = 0;
    plane.receiveShadow = true;
    scene.add(plane);

    // GUI Controls
    const gui = new dat.GUI();

    const sunFolder = gui.addFolder('Sun Light');
    sunFolder.add(sunLight, 'intensity', 0, 5, 0.01).name('Intensity');
    sunFolder.add(sunLight.position, 'x', -50, 50, 0.1).name('Position X');
    sunFolder.add(sunLight.position, 'y', 0, 50, 0.1).name('Position Y');
    sunFolder.add(sunLight.position, 'z', -50, 50, 0.1).name('Position Z');
    sunFolder.open();

    const pointFolder = gui.addFolder('Point Light');
    pointFolder.add(pointLight, 'intensity', 0, 5, 0.01).name('Intensity');
    pointFolder.add(pointLight.position, 'x', -50, 50, 0.1).name('Position X');
    pointFolder.add(pointLight.position, 'y', 0, 50, 0.1).name('Position Y');
    pointFolder.add(pointLight.position, 'z', -50, 50, 0.1).name('Position Z');
    pointFolder.open();

    // Animation variables
    let mixer;
    let actions = {};
    let activeAction;

    // HDRI Environment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    new THREE.RGBELoader()
      .setDataType(THREE.UnsignedByteType)
      .load(
        'https://bblism.github.io/ICG2/Pic.hdr',
        function (hdrTexture) {
          const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
          scene.background = envMap;
          scene.environment = envMap;
          hdrTexture.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        function (error) {
          console.error('Error loading HDR:', error);
        }
      );

    const gltfLoader = new THREE.GLTFLoader();

    // โหลด model.glb (static)
    gltfLoader.load(
      'https://bblism.github.io/ICG2/model.glb',
      function (gltf) {
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        model.scale.set(0.2, 0.2, 0.2);
        scene.add(model);
      },
      undefined,
      error => console.error('Error loading GLB:', error)
    );

    // โหลด anime.glb (animated)
    gltfLoader.load(
      'https://bblism.github.io/ICG2/anime.glb',
      function (gltf) {
        const model = gltf.scene;
        model.scale.set(0.2, 0.2, 0.2);

        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        // วางโมเดลบนพื้น
        const box = new THREE.Box3().setFromObject(model);
        const minY = box.min.y;
        model.position.y -= minY;

        scene.add(model);

        // ถ้ามี animations
        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(model);

          gltf.animations.forEach(clip => {
            actions[clip.name] = mixer.clipAction(clip);
          });

          const firstClipName = gltf.animations[0].name;
          activeAction = actions[firstClipName];
          activeAction.play();

          const animOptions = Object.keys(actions);
          const params = { animation: firstClipName };

          const animationFolder = gui.addFolder('Animations');
          animationFolder
            .add(params, 'animation', animOptions)
            .name('Play')
            .onChange(name => {
              if (activeAction) {
                activeAction.stop();
              }
              activeAction = actions[name];
              activeAction.reset().play();
            });
          animationFolder.open();
        }
      },
      undefined,
      error => console.error('Error loading anime.glb:', error)
    );

    // ---------- โหลด aboutme.glb ----------
    // โหลด aboutme.glb
    gltfLoader.load(
      'https://bblism.github.io/ICG2/aboutme.glb',
      function (gltf) {
        const aboutMeModel = gltf.scene;
        aboutMeModel.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.material = new THREE.MeshStandardMaterial({
              color: 0x3399ff,
              metalness: 0.3,
              roughness: 0.6
            });
          }
        });
        aboutMeModel.scale.set(0.4, 0.4, 0.4);
        aboutMeModel.position.set(-2, 0, 0);
        scene.add(aboutMeModel);

        addAboutMeObject(aboutMeModel); // <--- ทำให้กดได้
      }
    );


    // ---------- โหลด credit.glb ----------
    gltfLoader.load(
      'https://bblism.github.io/ICG2/cradit.glb',
      function (gltf) {
        const creditModel = gltf.scene;
        creditModel.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            child.material = new THREE.MeshStandardMaterial({
              color: 0x3399ff, 
              metalness: 0.4,
              roughness: 0.5
            });
          }
        });
        creditModel.scale.set(0.4, 0.4, 0.4);
        creditModel.position.set(2, 0, 0);
        scene.add(creditModel);
      },
      undefined,
      error => console.error('Error loading credit.glb:', error)
    );

    // ---------- Text "About Me" ----------
    // Text "About Me"
    fontLoader.load(
      'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
      function(font) {
        const textGeometry = new THREE.TextGeometry("About Me", {
          font: font,
          size: 0.5,
          height: 0.1,
          curveSegments: 12,
          bevelEnabled: true,
          bevelThickness: 0.02,
          bevelSize: 0.01,
          bevelSegments: 3
        });

        const textMaterial = new THREE.MeshStandardMaterial({ color: 0x3399ff });
        const textMesh = new THREE.Mesh(textGeometry, textMaterial);
        textMesh.castShadow = true;
        textMesh.receiveShadow = true;
        textMesh.position.set(-1, 0.01, 2);
        scene.add(textMesh);

        addAboutMeObject(textMesh); // <--- ทำให้กดได้
      }
    );


    // ---------- Text "Credit" ----------
    fontLoader.load(
      'https://threejs.org/examples/fonts/helvetiker_regular.typeface.json',
      function(font) {
        const textGeometry = new THREE.TextGeometry("Credit", {
          font: font,
          size: 0.2,
          height: 0.1,
          curveSegments: 12,
          bevelEnabled: true,
          bevelThickness: 0.02,
          bevelSize: 0.01,
          bevelSegments: 3
        });

        const creditTextMaterial = new THREE.MeshStandardMaterial({ color: 0x3399ff });
        const creditTextMesh = new THREE.Mesh(textGeometry, creditTextMaterial);
        creditTextMesh.castShadow = true;
        creditTextMesh.receiveShadow = true;
        creditTextMesh.position.set(1.5, 0.01, 2);
        scene.add(creditTextMesh);
      }
    );

    // Raycaster สำหรับตรวจจับการกด
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

let aboutMeObjects = []; // เก็บ object ของ About Me

// เก็บทั้งโมเดลกับตัวอักษร "About Me"
function addAboutMeObject(obj) {
  aboutMeObjects.push(obj);
}

// Mouse click event
window.addEventListener('click', (event) => {
  // แปลงพิกัดเมาส์เป็น normalized device coordinates (-1 ถึง 1)
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const intersects = raycaster.intersectObjects(aboutMeObjects, true);

  if (intersects.length > 0) {
    // เมื่อกดโดน About Me ให้เปลี่ยนหน้า
    window.location.href = "https://bblism.github.io/ICG2/aboutme.glb";
  }
});

    // Animate loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);

      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
