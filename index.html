<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Final with Light Controls</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <!-- three.js core -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dat.gui/build/dat.gui.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>

  <script>
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(10, 1, 2);
    camera.lookAt(0, 1, 0);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Sun Light (DirectionalLight)
    const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
    sunLight.position.set(10, 20, 10);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 1;
    sunLight.shadow.camera.far = 50;
    sunLight.shadow.camera.left = -10;
    sunLight.shadow.camera.right = 10;
    sunLight.shadow.camera.top = 10;
    sunLight.shadow.camera.bottom = -10;
    scene.add(sunLight);

    // Point Light
    const pointLight = new THREE.PointLight(0x00ff00, 1, 5);
    pointLight.position.set(3, 3, 0);
    pointLight.castShadow = true;
    scene.add(pointLight);

    // Floor
    const planeGeometry = new THREE.PlaneGeometry(20, 20);
    const planeMaterial = new THREE.MeshStandardMaterial({ color: 0x808080 });
    const plane = new THREE.Mesh(planeGeometry, planeMaterial);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = 0;
    plane.receiveShadow = true;
    scene.add(plane);

    // HDRI Environment
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    pmremGenerator.compileEquirectangularShader();

    new THREE.RGBELoader()
      .setDataType(THREE.UnsignedByteType)
      .load(
        'https://bblism.github.io/ICG2/Pic.hdr',
        function (hdrTexture) {
          const envMap = pmremGenerator.fromEquirectangular(hdrTexture).texture;
          scene.background = envMap;
          scene.environment = envMap;
          hdrTexture.dispose();
          pmremGenerator.dispose();
        },
        undefined,
        function (error) {
          console.error('Error loading HDR:', error);
        }
      );

    // Load GLB model
    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      'https://bblism.github.io/ICG2/model.glb',
      function (gltf) {
        const model = gltf.scene;
        model.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        model.scale.set(0.2, 0.2, 0.2);
        scene.add(model);
      },
      undefined,
      error => console.error('Error loading GLB:', error)
    );

    // GUI Controls
    const gui = new dat.GUI();

    const sunFolder = gui.addFolder('Sun Light');
    sunFolder.add(sunLight, 'intensity', 0, 5, 0.01).name('Intensity');
    sunFolder.add(sunLight.position, 'x', -50, 50, 0.1).name('Position X');
    sunFolder.add(sunLight.position, 'y', 0, 50, 0.1).name('Position Y');
    sunFolder.add(sunLight.position, 'z', -50, 50, 0.1).name('Position Z');
    sunFolder.open();

    const pointFolder = gui.addFolder('Point Light');
    pointFolder.add(pointLight, 'intensity', 0, 5, 0.01).name('Intensity');
    pointFolder.add(pointLight.position, 'x', -50, 50, 0.1).name('Position X');
    pointFolder.add(pointLight.position, 'y', 0, 50, 0.1).name('Position Y');
    pointFolder.add(pointLight.position, 'z', -50, 50, 0.1).name('Position Z');
    pointFolder.open();

    function animate() {
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
