<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Final with OBJ About Me & Credit + Far Camera View + Back Button</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; }

    /* ปุ่ม Back */
    #backButton {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 18px;
      font-size: 16px;
      background-color: #333;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      opacity: 0.85;
      display: none; /* ซ่อนตอนเริ่มต้น */
      z-index: 10;
    }
    #backButton:hover {
      background-color: #555;
    }
  </style>

  <!-- โหลด Three.js และเครื่องมือ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>

  <!-- ปุ่มกลับ -->
  <button id="backButton">Back</button>

<script>
  // ฉากและเรนเดอร์
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // กล้องและคอนโทรล
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0.2, 3, 8);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // แสงหลัก
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
  sunLight.position.set(10, 20, 10);
  sunLight.castShadow = true;
  scene.add(sunLight);

  const pointLight = new THREE.PointLight(0x00ff00, 1, 5);
  pointLight.position.set(3, 3, 0);
  scene.add(pointLight);

  // พื้น
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x808080 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // HDRI
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  new THREE.RGBELoader()
    .setDataType(THREE.UnsignedByteType)
    .load("https://bblism.github.io/ICG2/Pic.hdr", function(hdr) {
      const envMap = pmremGenerator.fromEquirectangular(hdr).texture;
      scene.background = envMap;
      scene.environment = envMap;
    });

  // โหลดโมเดลหลัก
  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load("https://bblism.github.io/ICG2/model.glb", function(gltf) {
    const model = gltf.scene;
    model.scale.set(0.2, 0.2, 0.2);
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
    scene.add(model);
  });

  // โหลด animation
  let mixer;
  gltfLoader.load("https://bblism.github.io/ICG2/anime.glb", function(gltf) {
    const model = gltf.scene;
    model.scale.set(0.2, 0.2, 0.2);
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
    const box = new THREE.Box3().setFromObject(model);
    model.position.y -= box.min.y;
    scene.add(model);

    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      const action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }
  });

  // โหลด OBJ / MTL
  const objLoader = new THREE.OBJLoader();
  const mtlLoader = new THREE.MTLLoader();
  const clickableObjects = [];
  let bigModel = null;
  let aboutMePlane = null;
  let creditPlanes = [];

  function loadOBJ(name, objPath, mtlPath, position) {
    mtlLoader.load(mtlPath, materials => {
      materials.preload();
      objLoader.setMaterials(materials);
      objLoader.load(objPath, obj => {
        obj.name = name;
        obj.position.copy(position);
        obj.scale.set(0.4, 0.4, 0.4);
        obj.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        scene.add(obj);
        clickableObjects.push({ name, object: obj });
      });
    });
  }

  // Shader
  const vert = `
    uniform float uTime;
    varying vec3 vNormal;
    varying vec3 vPosW;
    varying vec2 vUv;
    void main(){
      vNormal = normalize(mat3(modelMatrix) * normal);
      vec3 pos = position;
      vPosW   = ( modelMatrix * vec4(pos, 1.0)).xyz;
      vUv     = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
    }
  `;
  const frag = `
    uniform vec3 uLightDir1;
    uniform vec3 uLightColor1;
    uniform sampler2D uMap;
    varying vec3 vNormal;
    varying vec3 vPosW;
    varying vec2 vUv;
    void main(){
      vec4 texel = texture2D(uMap, vUv);
      float diffuse1 = max(dot(vNormal, uLightDir1), 0.0);
      float levels = 4.0;
      diffuse1 = floor(diffuse1 * levels) / levels;
      vec3 R1 = reflect(-uLightDir1, vNormal);
      vec3 V = normalize(cameraPosition - vPosW);
      float specular1 = max(pow(dot(R1, V), 64.0), 0.0);
      specular1 = step(0.5, specular1);
      specular1 *= diffuse1;
      vec3 base = texel.rgb;
      vec3 color = (base * (uLightColor1 * diffuse1 )) + vec3(specular1 );
      gl_FragColor = vec4(color, 1.0);
    }
  `;
  const material = new THREE.ShaderMaterial({
    vertexShader: vert,
    fragmentShader: frag,
    uniforms: {
      uTime: { value: 0 },
      uLightDir1: { value: new THREE.Vector3(-4, 3, 0.8).normalize() },
      uLightColor1: { value: new THREE.Color(0xFFFFFF) },
      uMap: { value: new THREE.TextureLoader().load('https://bblism.github.io/ICG2/gojo.jpeg') }
    }
  });

  const objLoader2 = new THREE.OBJLoader();
  objLoader.load(
    'https://bblism.github.io/ICG2/gojo.obj',
    (obj) => {
      obj.traverse((node) => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
          node.material = material;
        }
      });
      obj.position.set(3, 0, 1.2);
      obj.scale.set(1.5, 1.5, 1.5);
      obj.rotation.set(0, -Math.PI / 2, 0);
      scene.add(obj);
    },
    undefined,
    (error) => console.error('Error loading Object:', error)
  );

  // ตัวอักษร
  const fontLoader = new THREE.FontLoader();
  fontLoader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", font => {
    function createClickableText(text, position, name, color) {
      const textGeo = new THREE.TextGeometry(text, { font, size: 0.3, height: 0.05 });
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(textGeo, mat);
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;
      scene.add(mesh);
      clickableObjects.push({ name, object: mesh });
    }
    createClickableText("About Me", new THREE.Vector3(-2, 0.1, 2), "aboutme", 0x3399ff);
    createClickableText("Credit", new THREE.Vector3(2, 0.1, 2), "credit", 0xffcc00);
  });

  
  // โหลดโมเดลใหญ่
  const backButton = document.getElementById("backButton");
  function loadBigModel(name) {
  if (bigModel) { 
    scene.remove(bigModel); 
    bigModel = null; 
  }

  let objPath, mtlPath, modelPos, camPos, lookTarget;

  if (name === "aboutme") {
    objPath = "https://bblism.github.io/ICG2/aboutme.obj";
    mtlPath = "https://bblism.github.io/ICG2/aboutme.mtl";
    modelPos = new THREE.Vector3(-8, 0, 0);
    camPos = new THREE.Vector3(-12, 3, 6);
    lookTarget = new THREE.Vector3(-8, 1.5, 0);
  }  else if (name === "credit") {
    // สำหรับ Credit ไม่ต้องโหลด OBJ/MTL
    camPos = new THREE.Vector3(8, 3, 8);
    lookTarget = new THREE.Vector3(8, 1.5, 0);

    // ลบ plane เก่าก่อนโหลดใหม่
    creditPlanes.forEach(plane => scene.remove(plane));
    creditPlanes = [];

    const creditTextures = [
      'https://bblism.github.io/ICG2/house.png',
      'https://bblism.github.io/ICG2/gojo.png',
      'https://bblism.github.io/ICG2/cabinet.png',
      'https://bblism.github.io/ICG2/anime.png'
    ];

    creditTextures.forEach((url, index) => {
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(url, function(texture) {
        const width = texture.image.width;
        const height = texture.image.height;
        const planeHeight = 2;
        const planeWidth = planeHeight * (width / height);

        const geo = new THREE.PlaneGeometry(planeWidth, planeHeight);
        const mat = new THREE.ShaderMaterial({
    uniforms: {
        uMap: { value: texture },
        uBrightness: { value: 1 } 
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
        }
    `,
    fragmentShader: `
        uniform sampler2D uMap;
        uniform float uBrightness;
        varying vec2 vUv;
        void main() {
            vec4 tex = texture2D(uMap, vUv);
            gl_FragColor = vec4(tex.rgb * uBrightness, tex.a);
        }
    `,
    side: THREE.DoubleSide
});
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;

        // วางเรียง 2x2
        const col = index % 2;
        const row = Math.floor(index / 2);
        mesh.position.set(6 + col * (planeWidth + 0.5), 4 - row * (planeHeight + 0.5), 0);

        scene.add(mesh);
        creditPlanes.push(mesh);
      });
    });

    // แสดงปุ่ม Back และเลื่อนกล้อง
    backButton.style.display = "block";
    animateCamera(camPos, lookTarget);

    return; // จบฟังก์ชัน ไม่ต้องโหลด OBJ/MTL
  }

  // สำหรับ About Me ให้โหลด OBJ/MTL
  mtlLoader.load(mtlPath, materials => {
    materials.preload();
    objLoader.setMaterials(materials);
    objLoader.load(objPath, obj => {
      bigModel = obj;
      bigModel.position.copy(modelPos);
      bigModel.traverse(c => { if (c.isMesh) c.castShadow = true; c.receiveShadow = true; });
      scene.add(bigModel);

      // โหลด Plane + Texture About Me
      if (name === "aboutme") {
        if (aboutMePlane) scene.remove(aboutMePlane);
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('https://bblism.github.io/ICG2/aboutme.jpg', function(texture) {
          const width = texture.image.width;
          const height = texture.image.height;
          const planeHeight = 3;
          const planeWidth = planeHeight * (width / height);

          const mat = new THREE.ShaderMaterial({
            uniforms: {
                uMap: { value: texture },
                uBrightness: { value: 1 } 
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D uMap;
                uniform float uBrightness;
                varying vec2 vUv;
                void main() {
                    vec4 tex = texture2D(uMap, vUv);
                    gl_FragColor = vec4(tex.rgb * uBrightness, tex.a);
                }
            `,
            side: THREE.DoubleSide
        });
         aboutMePlane = new THREE.Mesh(
            new THREE.PlaneGeometry(planeWidth, planeHeight),
            mat
        );
        aboutMePlane.position.set(-10, 1.5, -1);
        scene.add(aboutMePlane);
    });
}
      animateCamera(camPos, lookTarget);
      backButton.style.display = "block";
    });
  });
}

backButton.addEventListener("click", () => {
    // ลบโมเดลใหญ่ที่กำลังแสดง
    if (bigModel) {
        scene.remove(bigModel);
        bigModel = null;
    }
     // ลบ Plane + Texture ของ About Me
    if (aboutMePlane) {
        scene.remove(aboutMePlane);
        aboutMePlane = null;
    }
     creditPlanes.forEach(plane => scene.remove(plane));
     creditPlanes = [];

    // ซ่อนปุ่ม Back
    backButton.style.display = "none";

    // กลับกล้องไปตำแหน่งเริ่มต้นของหน้าหลัก
    const mainCamPos = new THREE.Vector3(0.2, 3, 8); // ตำแหน่งกล้องเดิม
    const mainLookTarget = new THREE.Vector3(0, 0, 0); // จุดมุมมองเดิม
    animateCamera(mainCamPos, mainLookTarget);
});
  // ฟังก์ชันเลื่อนกล้อง
  function animateCamera(targetPos, lookTarget) {
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    let t = 0;
    const duration = 1.5;
    const interval = setInterval(() => {
      t += 0.02;
      const k = Math.min(t / duration, 1);
      camera.position.lerpVectors(startPos, targetPos, k);
      controls.target.lerpVectors(startTarget, lookTarget, k);
      if (k >= 1) clearInterval(interval);
    }, 16);
  }

  // ตรวจจับคลิก
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.addEventListener("click", event => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects.map(c => c.object), true);
    if (intersects.length > 0) {
      const intersected = intersects[0].object;
      const clicked = clickableObjects.find(c => c.object === intersected || intersected.parent === c.object);
      if (clicked) loadBigModel(clicked.name);
    }
  });

  // วนลูป animate
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
