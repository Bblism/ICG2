<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Final with OBJ About Me & Credit + Far Camera View</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; }
    canvas { display: block; }
  </style>

  <!-- โหลด Three.js และเครื่องมือ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/RGBELoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body>
<script>
  // ฉากและเรนเดอร์
  const scene = new THREE.Scene();
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  // กล้องและคอนโทรล
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(8, 3, 6);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // แสงหลัก
  const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
  sunLight.position.set(10, 20, 10);
  sunLight.castShadow = true;
  scene.add(sunLight);

  const pointLight = new THREE.PointLight(0x00ff00, 1, 5);
  pointLight.position.set(3, 3, 0);
  scene.add(pointLight);

  // พื้น
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(30, 30),
    new THREE.MeshStandardMaterial({ color: 0x808080 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // HDRI
  const pmremGenerator = new THREE.PMREMGenerator(renderer);
  new THREE.RGBELoader()
    .setDataType(THREE.UnsignedByteType)
    .load("https://bblism.github.io/ICG2/Pic.hdr", function(hdr) {
      const envMap = pmremGenerator.fromEquirectangular(hdr).texture;
      scene.background = envMap;
      scene.environment = envMap;
    });

  // โหลดโมเดลหลัก
  const gltfLoader = new THREE.GLTFLoader();
  gltfLoader.load("https://bblism.github.io/ICG2/model.glb", function(gltf) {
    const model = gltf.scene;
    model.scale.set(0.2, 0.2, 0.2);
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
    scene.add(model);
  });

  // โหลด animation
  let mixer;
  gltfLoader.load("https://bblism.github.io/ICG2/anime.glb", function(gltf) {
    const model = gltf.scene;
    model.scale.set(0.2, 0.2, 0.2);
    model.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
    const box = new THREE.Box3().setFromObject(model);
    model.position.y -= box.min.y;
    scene.add(model);

    if (gltf.animations.length > 0) {
      mixer = new THREE.AnimationMixer(model);
      const action = mixer.clipAction(gltf.animations[0]);
      action.play();
    }
  });

  // โหลด OBJ / MTL
  const objLoader = new THREE.OBJLoader();
  const mtlLoader = new THREE.MTLLoader();
  const clickableObjects = [];
  let bigModel = null;

  function loadOBJ(name, objPath, mtlPath, position) {
    mtlLoader.load(mtlPath, materials => {
      materials.preload();
      objLoader.setMaterials(materials);
      objLoader.load(objPath, obj => {
        obj.name = name;
        obj.position.copy(position);
        obj.scale.set(0.4, 0.4, 0.4);
        obj.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        scene.add(obj);
        clickableObjects.push({ name, object: obj });
      });
    });
  }

  
  // ตัวอักษร
  const fontLoader = new THREE.FontLoader();
  fontLoader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", font => {
    function createClickableText(text, position, name, color) {
      const textGeo = new THREE.TextGeometry(text, {
        font: font,
        size: 0.3,
        height: 0.05,
      });
      const mat = new THREE.MeshStandardMaterial({ color });
      const mesh = new THREE.Mesh(textGeo, mat);
      mesh.position.copy(position);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.name = name;
      scene.add(mesh);
      clickableObjects.push({ name, object: mesh });
    }

    createClickableText("About Me", new THREE.Vector3(-2, 0.1, 2), "aboutme", 0x3399ff);
    createClickableText("Credit", new THREE.Vector3(2, 0.1, 2), "credit", 0xffcc00);
  });

  // โหลดโมเดลใหญ่และเซ็ตกล้องออกห่าง
  function loadBigModel(name) {
    if (bigModel) { scene.remove(bigModel); bigModel = null; }

    let objPath, mtlPath, modelPos, camPos, lookTarget;

    if (name === "aboutme") {
      objPath = "https://bblism.github.io/ICG2/aboutme.obj";
      mtlPath = "https://bblism.github.io/ICG2/aboutme.mtl";
      modelPos = new THREE.Vector3(-8, 0, 0);   // ห่างจากฉากหลักไปซ้าย
      camPos = new THREE.Vector3(-12, 3, 4);    // กล้องอยู่ไกลกว่านั้น
      lookTarget = new THREE.Vector3(-8, 1.5, 0);
    } else if (name === "credit") {
      objPath = "https://bblism.github.io/ICG2/credit.obj";
      mtlPath = "https://bblism.github.io/ICG2/credit.mtl";
      modelPos = new THREE.Vector3(8, 0, 0);    // ห่างจากฉากหลักไปขวา
      camPos = new THREE.Vector3(12, 3, 4);     // กล้องอยู่ไกลกว่านั้น
      lookTarget = new THREE.Vector3(8, 1.5, 0);
    }

    // โหลดโมเดลใหญ่
    mtlLoader.load(mtlPath, materials => {
      materials.preload();
      objLoader.setMaterials(materials);
      objLoader.load(objPath, obj => {
        bigModel = obj;
        bigModel.position.copy(modelPos);
        bigModel.scale.set(1, 1, 1);
        bigModel.traverse(c => { if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }});
        scene.add(bigModel);
      });
    });

    // เลื่อนกล้องไปยังตำแหน่งใหม่แบบ smooth
    animateCamera(camPos, lookTarget);
  }

  // ฟังก์ชันเลื่อนกล้องแบบ smooth
  function animateCamera(targetPos, lookTarget) {
    const startPos = camera.position.clone();
    const startTarget = controls.target.clone();
    let t = 0;
    const duration = 1.5;
    const interval = setInterval(() => {
      t += 0.02;
      const k = Math.min(t / duration, 1);
      camera.position.lerpVectors(startPos, targetPos, k);
      controls.target.lerpVectors(startTarget, lookTarget, k);
      if (k >= 1) clearInterval(interval);
    }, 16);
  }

  // ตรวจจับคลิก
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.addEventListener("click", event => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(clickableObjects.map(c => c.object), true);
    if (intersects.length > 0) {
      const intersected = intersects[0].object;
      const clicked = clickableObjects.find(c => c.object === intersected || intersected.parent === c.object);
      if (clicked) loadBigModel(clicked.name);
    }
  });

  // วนลูป animate
  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const delta = clock.getDelta();
    if (mixer) mixer.update(delta);
    controls.update();
    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
